<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/@lark-base-open/js-sdk@latest/dist/index.js"></script>
  <title>生日海报生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 {
      margin-bottom: 16px;
    }
    .controls {
      margin-bottom: 16px;
    }
    input, button {
      padding: 10px 12px;
      font-size: 14px;
      margin-right: 8px;
    }
    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
      background: white;
    }
    #downloadLink {
      display: none;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>生日海报生成器</h2>

  <div class="controls">
    <input id="nameInput" type="text" placeholder="请输入员工姓名" />
    <button id="readNameBtn">读取当前行姓名</button>
    <button id="generateBtn">生成海报</button>
  </div>

  <canvas id="posterCanvas" width="1242" height="2208"></canvas>
  <br />
  <a id="downloadLink" download="birthday-poster.png">下载海报</a>

  <script>
    const canvas = document.getElementById("posterCanvas");
    const ctx = canvas.getContext("2d");
    const generateBtn = document.getElementById("generateBtn");
    const nameInput = document.getElementById("nameInput");
    const downloadLink = document.getElementById("downloadLink");
    const readNameBtn = document.getElementById("readNameBtn");

    const templateImg = new Image();
    templateImg.src = "./template.jpg";

    function drawPoster(name) {
      console.log("开始绘制", templateImg.naturalWidth, templateImg.naturalHeight);

      if (!templateImg.naturalWidth || !templateImg.naturalHeight) {
        alert("模板图片没有加载成功，请检查 template.jpg 文件名是否正确");
        return;
      }

      canvas.width = templateImg.naturalWidth;
      canvas.height = templateImg.naturalHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(templateImg, 0, 0);

      ctx.fillStyle = "#8A0AA5";
      ctx.font = 'bold 60px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      ctx.fillText(name, 352, 1047);

      const url = canvas.toDataURL("image/png");
      downloadLink.href = url;
      downloadLink.style.display = "inline-block";
    }

    templateImg.onload = function () {
      console.log("图片加载成功");
      drawPoster("王玥");
    };

    templateImg.onerror = function () {
      alert("template.jpg 加载失败，请检查 GitHub 仓库里的文件名是不是完全叫 template.jpg");
    };

    generateBtn.addEventListener("click", () => {
      const name = nameInput.value.trim() || "王玥";
      drawPoster(name);
    });

    readNameBtn.addEventListener("click", async () => {
      try {
        const { bitable } = window.larkBase;

        const table = await bitable.base.getActiveTable();
        const selection = await bitable.base.getSelection();

        const recordId = selection.recordId;

        if (!recordId) {
          alert("请先在多维表里选中一条记录");
          return;
        }

        const nameField = await table.getFieldByName("姓名");
        const value = await nameField.getValue(recordId);

        let name = "";

        if (Array.isArray(value)) {
          name = value.map(item => item.text || item.name || "").join("");
        } else if (typeof value === "string") {
          name = value;
        } else if (value && value.text) {
          name = value.text;
        }

        nameInput.value = name;

        if (!name) {
          alert("当前记录的姓名为空");
        }
      } catch (err) {
        console.error(err);
        alert("读取姓名失败，请打开控制台查看错误");
      }
    });
  </script>
</body>
</html>
