<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日海报生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 {
      margin-bottom: 16px;
    }
    .controls {
      margin-bottom: 16px;
    }
    input, button {
      padding: 10px 12px;
      font-size: 14px;
      margin-right: 8px;
    }
    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
      background: white;
    }
    #downloadLink {
      display: none;
      margin-top: 12px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h2>生日海报生成器</h2>

  <div class="controls">
    <input id="nameInput" type="text" placeholder="请输入员工姓名" />
    <button id="generateBtn">生成海报</button>
  </div>

  <canvas id="posterCanvas" width="1242" height="2208"></canvas>
  <br />
  <a id="downloadLink" download="birthday-poster.png">下载海报</a>

<script>
  const canvas = document.getElementById("posterCanvas");
  const ctx = canvas.getContext("2d");
  const generateBtn = document.getElementById("generateBtn");
  const nameInput = document.getElementById("nameInput");
  const downloadLink = document.getElementById("downloadLink");

  const templateImg = new Image();
  templateImg.src = "./template.jpg";

  function drawPoster(name) {
    // 让 canvas 自动使用原图尺寸，不再拉伸
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;

    ctx.clearRect(0, 0);

    // 按原尺寸画图
    ctx.drawImage(templateImg, 0, 0);

    // 名字样式
    ctx.fillStyle = "#8A0AA5";
    ctx.font = 'bold 60px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    // 名字位置
    ctx.fillText(name, 352, 1047);

    const url = canvas.toDataURL("image/png");
    downloadLink.href = url;
    downloadLink.style.display = "inline-block";
  }

  templateImg.onload = function () {
    drawPoster("王玥");
  };

  generateBtn.addEventListener("click", () => {
    const name = nameInput.value.trim() || "王玥";
    drawPoster(name);
  });
</script>
</body>
</html>
